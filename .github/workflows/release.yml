name: Build Desktop Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.6.5). Leave empty to use latest release or package version.'
        required: false
        default: ''

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Release target
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_tag="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_TAG" ]]; then
            release_tag="$INPUT_TAG"
          elif release_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' 2>/dev/null)" && [[ -n "$release_tag" ]]; then
            echo "Found existing release: $release_tag"
          else
            project_ver="$(node -p 'require("./desktop/src-tauri/tauri.conf.json").version' 2>/dev/null || echo '')"
            if [[ -n "$project_ver" ]]; then
              release_tag="v$project_ver"
              echo "No previous release found. Using project version: $release_tag"
            else
              echo "No published Release found and could not determine project version" >&2
              exit 1
            fi
          fi

          if ! gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Reader $release_tag" \
              --generate-notes
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Release target: $release_tag"

  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: macos-latest
            platform: macos
            arch: universal
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Verify release metadata
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_tag }}
        run: node scripts/check-release-metadata.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --run

      - name: Test Rust core
        run: cargo test --lib -j 4

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri bundle
        working-directory: desktop
        env:
          CARGO_BUILD_JOBS: 4
        run: npx tauri build --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" -- --locked

      - name: Ad-hoc sign macOS app bundle and rebuild DMG
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          APP_PATH="$BUNDLE_DIR/macos/Reader.app"
          if [[ ! -d "$APP_PATH" ]]; then
            APP_PATH=$(find target -maxdepth 6 -type d -name "Reader.app" | head -n 1 || true)
          fi
          if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then
            echo "Reader.app not found!" >&2
            exit 1
          fi

          echo "Signing $APP_PATH with ad-hoc signature..."
          codesign --force --deep --sign - "$APP_PATH"
          codesign -dvvv "$APP_PATH" 2>&1

          DMG_PATH=$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -type f -name "*.dmg" | head -n 1 || true)
          if [[ -z "$DMG_PATH" ]]; then
            DMG_PATH=$(find target -maxdepth 6 -type f -name "*.dmg" | head -n 1 || true)
          fi
          if [[ -n "$DMG_PATH" ]]; then
            echo "Rebuilding DMG $DMG_PATH with signed Reader.app..."
            STAGE_DIR=$(mktemp -d)
            ditto "$APP_PATH" "$STAGE_DIR/Reader.app"
            ln -s /Applications "$STAGE_DIR/Applications"
            rm -f "$DMG_PATH"
            hdiutil create -volname "Reader" -srcfolder "$STAGE_DIR" -ov -format UDZO "$DMG_PATH"
            rm -rf "$STAGE_DIR"
          fi

      - name: Collect release artifacts
        env:
          TAURI_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_tag }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: node scripts/collect-desktop-artifacts.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Reader-${{ needs.prepare-release.outputs.release_tag }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

      - name: Upload platform files to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.prepare-release.outputs.release_tag }}" release/* --clobber

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare-release
      - build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish completed Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          # 先结束草稿状态，再单独设置 latest，避免 GitHub API 在同一请求中
          # 先校验 latest 而把仍处于 draft 状态的 Release 判定为无效。
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --latest
